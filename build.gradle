plugins {
    id 'java'
    id 'maven-publish'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
	mavenLocal()
    mavenCentral()
}

version = '0.1.0'

// gradle publish
publishing {

    publications {
        maven(MavenPublication) {
            groupId = 'io.utility'
            artifactId = 'api'
            version = project.version
            
            artifact 'build/libs/api_utility-' + project.version + '.jar'
        }
    }

    repositories {
        maven {
            credentials {
                username = "admin"
                password = "password"
            }
            url = "http://localhost:8081/artifactory/libs-release-local"
            allowInsecureProtocol = true
        }
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'Api-Utility', 'Implementation-Version': project.version)
    }
}

ext {
	logbackVersion = '1.3.6'
	slf4jVersion = '2.0.7'
}

dependencies {
	implementation 'org.slf4j:slf4j-api:' + slf4jVersion
	runtimeOnly 'org.slf4j:jcl-over-slf4j:' + slf4jVersion
	implementation 'ch.qos.logback:logback-classic:' + logbackVersion

	implementation 'net.arnx:jsonic:1.3.5'
	implementation 'org.apache.httpcomponents:httpclient:4.5.14'
	implementation 'org.apache.httpcomponents:httpmime:4.5.14'
	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation 'com.googlecode.json-simple:json-simple:1.1.1'
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// To install this jar into localhost
// gradle publishToMavenLocal like gradle install
